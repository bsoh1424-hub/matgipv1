<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 부산 맛집 탐방</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="text-center mb-4">
        <h2 class="text-primary fw-bold">🌊 회원가입</h2>
        <p class="text-muted small">부산 맛집 탐방 서비스 회원이 되어보세요!</p>
    </div>

    <div th:if="${error != null}" class="alert alert-danger py-2 small" th:text="${error}">
        회원가입 중 오류가 발생했습니다.
    </div>

    <form th:action="@{/member/register}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">이메일 계정</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="example@naver.com" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호 입력" required>
        </div>

        <div class="mb-3">
            <label for="nickname" class="form-label fw-semibold">닉네임</label>
            <input type="text" class="form-control" id="nickname" name="nickname" placeholder="닉네임 입력" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">가입 완료하기</button>
    </form>

    <div class="text-center mt-4 small text-muted">
        이미 계정이 있으신가요? <a th:href="@{/member/login}" class="text-primary fw-semibold text-decoration-none">로그인</a>
    </div>
    <div class="text-center mt-2">
        <a th:href="@{/place/list}" class="text-secondary small text-decoration-none">← 메인으로 돌아가기</a>
    </div>
</div>

</body>
</html>
