<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<section th:fragment="reviewSection(dto, reviews, topReviews)" class="card review-card shadow-sm border-0 mb-5">
    <!-- [수정] 방문자 리뷰 fragment를 현재 프로젝트 변수에 맞게 추가했습니다. -->
    <div class="card-header bg-light py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">💬 방문자 리뷰
            <span class="badge bg-primary rounded-pill ms-1" th:text="${reviews != null ? reviews.size() : 0}">0</span>
        </h5>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary btn-sm fw-bold"
                    data-bs-toggle="modal" data-bs-target="#fragmentAllReviewsModal">리뷰 전체보기</button>
            <button type="button" class="btn btn-primary btn-sm fw-bold"
                    th:if="${session.loginMember != null}"
                    data-bs-toggle="modal" data-bs-target="#fragmentReviewFormModal">✏️ 리뷰 작성하기</button>
        </div>
    </div>

    <div class="card-body p-4">
        <!-- [수정] 본문에는 최신 리뷰 3건만 표시합니다. -->
        <div th:if="${topReviews == null or #lists.isEmpty(topReviews)}" class="text-center text-muted py-3">아직 등록된 리뷰가 없습니다. 첫 리뷰를 남겨보세요!</div>
        <div th:each="r : ${topReviews}" class="border-bottom pb-3 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <strong class="text-dark" th:text="${r.writerNickname}">작성자</strong>
                <small class="text-muted" th:text="${r.regDate != null ? #temporals.format(r.regDate, 'yyyy-MM-dd') : ''}"></small>
            </div>
            <div class="text-warning my-1"><span th:each="i : ${#numbers.sequence(1, r.rating != null ? r.rating : 0)}">⭐</span></div>
            <p class="mb-0 text-secondary" style="white-space:pre-line" th:text="${r.content}">리뷰 내용</p>
            <img th:if="${r.imageUrl != null}" th:src="${r.imageUrl}" class="img-fluid rounded mt-2 border" style="max-height:140px; object-fit:cover;" alt="리뷰 사진">
        </div>
    </div>

    <!-- [수정] 리뷰 전체보기 모달을 추가했습니다. -->
    <div class="modal fade" id="fragmentAllReviewsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">📋 전체 방문자 리뷰</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body p-4">
                    <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="text-center text-muted py-4">아직 등록된 리뷰가 없습니다.</div>
                    <div th:each="r : ${reviews}" class="border-bottom pb-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="text-dark" th:text="${r.writerNickname}">작성자</strong>
                            <small class="text-muted" th:text="${r.regDate != null ? #temporals.format(r.regDate, 'yyyy-MM-dd HH:mm') : ''}"></small>
                        </div>
                        <div class="text-warning my-1"><span th:each="i : ${#numbers.sequence(1, r.rating != null ? r.rating : 0)}">⭐</span></div>
                        <p class="mb-0 text-secondary" style="white-space:pre-line" th:text="${r.content}">리뷰 내용</p>
                        <img th:if="${r.imageUrl != null}" th:src="${r.imageUrl}" class="img-fluid rounded mt-2 border" style="max-height:180px; object-fit:cover;" alt="리뷰 사진">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- [수정] 기존 /place/review/add API와 연결된 리뷰 작성 모달을 추가했습니다. -->
    <div class="modal fade" id="fragmentReviewFormModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">✍️ 리뷰 작성하기</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <form th:action="@{/place/review/add}" method="post" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <input type="hidden" name="restaurantId" th:value="${dto.pno}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">⭐ 별점 평가</label>
                                <select class="form-select form-select-sm" name="rating" required>
                                    <option value="5" selected>⭐⭐⭐⭐⭐ (5점 - 최고예요!)</option>
                                    <option value="4">⭐⭐⭐⭐ (4점 - 맛있어요)</option>
                                    <option value="3">⭐⭐⭐ (3점 - 보통이에요)</option>
                                    <option value="2">⭐⭐ (2점 - 아쉬워요)</option>
                                    <option value="1">⭐ (1점 - 별로예요)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">🍚 혼밥 난이도</label>
                                <select class="form-select form-select-sm" name="soloLevel">
                                    <option value="LV1" selected>LV1 - 편의점/패스트푸드 수준</option>
                                    <option value="LV2">LV2 - 푸드코트/분식집</option>
                                    <option value="LV3">LV3 - 일반 식당/백반집</option>
                                    <option value="LV4">LV4 - 패밀리 레스토랑/고기뷔페</option>
                                    <option value="LV5">LV5 - 술집/고깃집</option>
                                </select>
                            </div>
                        </div>
                        <label class="form-label small fw-bold">💬 리뷰 내용</label>
                        <textarea name="content" class="form-control mb-3" rows="4" maxlength="1000" required></textarea>
                        <label class="form-label small fw-bold">📷 음식 / 방문 사진 첨부</label>
                        <input type="file" name="file" class="form-control form-control-sm" accept="image/*">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary btn-sm px-4 fw-bold">리뷰 등록</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</html>
