<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산 맛집 탐방</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 추가 커스텀 스타일 (필요시) -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        footer {
            margin-top: auto;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- 공통 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/place/list}">🌊 부산 맛집 지도</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/place/list}">맛집 목록</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/place/register}">+ 맛집 등록</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 메인 컨텐츠 영역 (list.html의 layout:fragment="content" 영역이 들어옴) -->
<main class="container my-4">
    <div layout:fragment="content">
        <!-- 각 페이지의 본문 내용이 대입되는 곳입니다 -->
    </div>
</main>

<!-- 공통 푸터 -->
<footer class="bg-white py-4 border-top text-center text-muted mt-5">
    <div class="container">
        <p class="mb-0">© 2026 부산 맛집 탐방 서비스. All rights reserved.</p>
    </div>
</footer>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 각 페이지별 전용 스크립트 블록 (필요시) -->
<th:block layout:fragment="script"></th:block>

</body>
</html>
