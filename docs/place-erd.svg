<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#14324a}.subtitle{font:16px Arial,sans-serif;fill:#587083}
      .table-title{font:700 18px Arial,sans-serif;fill:#fff}.field{font:13px Arial,sans-serif;fill:#203848}
      .type{font:12px Arial,sans-serif;fill:#718392}.pk{font:700 11px Arial,sans-serif;fill:#c63f48}.fk{font:700 11px Arial,sans-serif;fill:#25866d}
      .note-title{font:700 18px Arial,sans-serif;fill:#0b8d8b}.note{font:14px Arial,sans-serif;fill:#40515c}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7290a2"/></marker>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="54" y="54" class="title">ERD — 부산 맛집 탐방 서비스</text>
  <text x="54" y="84" class="subtitle">Place 기능 중심 전체 Entity 및 논리적 연결 관계</text>

  <!-- relation lines: IDs are manually stored, so relations are logical -->
  <path d="M390 205 C500 205 535 205 650 205" fill="none" stroke="#7290a2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390 250 C500 420 570 425 650 425" fill="none" stroke="#7290a2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1010 205 C1070 205 1080 205 1150 205" fill="none" stroke="#7290a2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1010 250 C1080 420 1110 425 1150 425" fill="none" stroke="#7290a2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390 300 C600 720 950 720 1150 555" fill="none" stroke="#b4c0c8" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <!-- member -->
  <g transform="translate(50 125)">
    <rect width="340" height="250" rx="8" fill="#f7fbff" stroke="#66859b" stroke-width="2"/>
    <rect width="340" height="42" rx="8" fill="#397ba8"/><rect y="34" width="340" height="8" fill="#397ba8"/>
    <text x="16" y="27" class="table-title">member</text><text x="245" y="26" font-size="11" fill="#dcecf8">회원</text>
    <text x="14" y="65" class="pk">PK</text><text x="48" y="65" class="field">member_no</text><text x="254" y="65" class="type">BIGINT</text>
    <text x="14" y="87" class="field">provider_id</text><text x="254" y="87" class="type">VARCHAR</text>
    <text x="14" y="109" class="field">email (UNIQUE)</text><text x="254" y="109" class="type">VARCHAR(100)</text>
    <text x="14" y="131" class="field">password</text><text x="254" y="131" class="type">VARCHAR</text>
    <text x="14" y="153" class="field">nickname</text><text x="254" y="153" class="type">VARCHAR(50)</text>
    <text x="14" y="175" class="field">profile_image</text><text x="254" y="175" class="type">VARCHAR</text>
    <text x="14" y="197" class="field">role</text><text x="254" y="197" class="type">VARCHAR</text>
    <text x="14" y="219" class="field">provider</text><text x="254" y="219" class="type">VARCHAR(20)</text>
  </g>

  <!-- place -->
  <g transform="translate(650 125)">
    <rect width="360" height="480" rx="8" fill="#f7fffd" stroke="#208b82" stroke-width="2"/>
    <rect width="360" height="42" rx="8" fill="#198b83"/><rect y="34" width="360" height="8" fill="#198b83"/>
    <text x="16" y="27" class="table-title">busan_restaurants</text><text x="280" y="26" font-size="11" fill="#d9f5f0">맛집</text>
    <text x="14" y="65" class="pk">PK</text><text x="48" y="65" class="field">id</text><text x="278" y="65" class="type">BIGINT</text>
    <text x="14" y="87" class="field">gu_name</text><text x="278" y="87" class="type">VARCHAR(50)</text>
    <text x="14" y="109" class="field">restaurant_name_ko</text><text x="278" y="109" class="type">VARCHAR(100)</text>
    <text x="14" y="131" class="field">restaurant_name_en</text><text x="278" y="131" class="type">VARCHAR(100)</text>
    <text x="14" y="153" class="field">category</text><text x="278" y="153" class="type">VARCHAR(50)</text>
    <text x="14" y="175" class="field">address</text><text x="278" y="175" class="type">VARCHAR(255)</text>
    <text x="14" y="197" class="field">phone</text><text x="278" y="197" class="type">VARCHAR(30)</text>
    <text x="14" y="219" class="field">main_menu</text><text x="278" y="219" class="type">VARCHAR(255)</text>
    <text x="14" y="241" class="field">price_range</text><text x="278" y="241" class="type">VARCHAR(100)</text>
    <text x="14" y="263" class="field">operating_hours</text><text x="278" y="263" class="type">VARCHAR(250)</text>
    <text x="14" y="285" class="field">break_time</text><text x="278" y="285" class="type">VARCHAR(100)</text>
    <text x="14" y="307" class="field">off_days</text><text x="278" y="307" class="type">VARCHAR(100)</text>
    <text x="14" y="329" class="field">parking</text><text x="278" y="329" class="type">VARCHAR(100)</text>
    <text x="14" y="351" class="field">image_url1 / image_url2</text><text x="278" y="351" class="type">VARCHAR(500)</text>
    <text x="14" y="373" class="field">summary_ko / summary_en</text><text x="278" y="373" class="type">VARCHAR(2000)</text>
    <text x="14" y="395" class="field">page_num</text><text x="278" y="395" class="type">INT</text>
    <text x="14" y="417" class="field">source_type / api_id</text><text x="278" y="417" class="type">VARCHAR</text>
    <text x="14" y="439" class="field">regdate / moddate</text><text x="278" y="439" class="type">DATETIME</text>
    <text x="14" y="463" class="note">공공데이터의 UC_SEQ는 api_id로 저장</text>
  </g>

  <!-- review -->
  <g transform="translate(650 650)">
    <rect width="360" height="245" rx="8" fill="#fffaf3" stroke="#c58a30" stroke-width="2"/>
    <rect width="360" height="42" rx="8" fill="#c47c18"/><rect y="34" width="360" height="8" fill="#c47c18"/>
    <text x="16" y="27" class="table-title">review</text><text x="280" y="26" font-size="11" fill="#fff0d0">리뷰</text>
    <text x="14" y="65" class="pk">PK</text><text x="48" y="65" class="field">id</text><text x="278" y="65" class="type">BIGINT</text>
    <text x="14" y="87" class="fk">FK</text><text x="48" y="87" class="field">restaurant_id</text><text x="278" y="87" class="type">BIGINT</text>
    <text x="14" y="109" class="fk">FK</text><text x="48" y="109" class="field">member_id</text><text x="278" y="109" class="type">BIGINT</text>
    <text x="14" y="131" class="field">rating</text><text x="278" y="131" class="type">INT</text>
    <text x="14" y="153" class="field">solo_level</text><text x="278" y="153" class="type">VARCHAR</text>
    <text x="14" y="175" class="field">content</text><text x="278" y="175" class="type">TEXT</text>
    <text x="14" y="197" class="field">hidden</text><text x="278" y="197" class="type">BOOLEAN</text>
    <text x="14" y="219" class="field">image names / regdate / moddate</text><text x="278" y="219" class="type">VARCHAR / DATETIME</text>
  </g>

  <!-- bookmark -->
  <g transform="translate(1150 125)">
    <rect width="360" height="205" rx="8" fill="#f7fffd" stroke="#208b82" stroke-width="2"/>
    <rect width="360" height="42" rx="8" fill="#198b83"/><rect y="34" width="360" height="8" fill="#198b83"/>
    <text x="16" y="27" class="table-title">bookmark</text><text x="280" y="26" font-size="11" fill="#d9f5f0">찜</text>
    <text x="14" y="65" class="pk">PK</text><text x="48" y="65" class="field">id</text><text x="278" y="65" class="type">BIGINT</text>
    <text x="14" y="87" class="fk">FK</text><text x="48" y="87" class="field">member_id</text><text x="278" y="87" class="type">BIGINT</text>
    <text x="14" y="109" class="fk">FK</text><text x="48" y="109" class="field">restaurant_id</text><text x="278" y="109" class="type">BIGINT</text>
    <text x="14" y="131" class="field">regdate / moddate</text><text x="278" y="131" class="type">DATETIME</text>
    <text x="14" y="165" class="note">UNIQUE: member_id + restaurant_id</text>
  </g>

  <!-- log -->
  <g transform="translate(1150 390)">
    <rect width="360" height="270" rx="8" fill="#faf7ff" stroke="#8065aa" stroke-width="2"/>
    <rect width="360" height="42" rx="8" fill="#7557a3"/><rect y="34" width="360" height="8" fill="#7557a3"/>
    <text x="16" y="27" class="table-title">member_log_data</text><text x="275" y="26" font-size="11" fill="#eee6ff">활동 로그</text>
    <text x="14" y="65" class="pk">PK</text><text x="48" y="65" class="field">log_id</text><text x="278" y="65" class="type">BIGINT</text>
    <text x="14" y="87" class="field">member_id</text><text x="278" y="87" class="type">BIGINT NULL</text>
    <text x="14" y="109" class="field">action_type</text><text x="278" y="109" class="type">VARCHAR(50)</text>
    <text x="14" y="131" class="field">description / request_url</text><text x="278" y="131" class="type">VARCHAR</text>
    <text x="14" y="153" class="field">http_method / ip_address</text><text x="278" y="153" class="type">VARCHAR</text>
    <text x="14" y="175" class="field">target_id / target_name</text><text x="278" y="175" class="type">BIGINT / VARCHAR</text>
    <text x="14" y="197" class="field">search_keyword / extra_details</text><text x="278" y="197" class="type">VARCHAR</text>
    <text x="14" y="219" class="field">status_code / execution_time_ms</text><text x="278" y="219" class="type">INT / BIGINT</text>
    <text x="14" y="241" class="field">regdate / moddate</text><text x="278" y="241" class="type">DATETIME</text>
  </g>

  <!-- notes -->
  <g transform="translate(1110 720)">
    <rect width="430" height="150" rx="12" fill="#f1f7f8"/>
    <text x="25" y="35" class="note-title">관계 표현 기준</text>
    <text x="25" y="65" class="note">실제 Entity에는 @ManyToOne이 없고</text>
    <text x="25" y="87" class="note">member_id·restaurant_id를 직접 저장합니다.</text>
    <text x="25" y="115" class="note">실선: 기능상 논리 관계 / 점선: 로그 참조</text>
  </g>

  <text x="55" y="930" class="subtitle">PK: Primary Key  ·  FK: 논리적 Foreign Key  ·  BaseEntity 공통 컬럼: regdate, moddate</text>
</svg>
